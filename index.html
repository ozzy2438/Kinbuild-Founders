<html lang="en">

    <meta charset="UTF-8" />

    <meta name="description" content="Find people you can build a startup with. StartBeside is shaping a Melbourne pilot for future co-founders, matched by skills, sector and how you like to work." />
    <meta property="og:title" content="StartBeside — Don't build alone." />
    <meta property="og:description" content="Different strengths. Shared direction. A Melbourne community for future co-founders." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="StartBeside" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og/startbeside-share.jpg" />
    <meta property="og:image:width" content="1200" />

    <meta name="twitter:card" content="summary_large_image" />

  </head>
  <body>
    <!-- Netlify detects the React form's fields in the built HTML. Keep these
         names aligned with InterestForm.tsx; this form is never shown. -->
    <form name="startbeside-interest" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="startbeside-interest" />
      <input name="name" />
      <input type="email" name="email" />
      <input name="sector" />
      <input name="skill" />
      <input name="looking_for" />
      <input name="working_style" />
      <input name="weekly_hours" />
      <input name="availability" />
      <input name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
